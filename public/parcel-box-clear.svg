<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Tracked parcel box" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<defs>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efbc7a"/><stop offset="0.52" stop-color="#d99a54"/><stop offset="1" stop-color="#bb7338"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0.95" y2="1"><stop offset="0" stop-color="#d9954f"/><stop offset="0.58" stop-color="#bc6f36"/><stop offset="1" stop-color="#8f481f"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ad602b"/><stop offset="1" stop-color="#6e3215"/></linearGradient>
  <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5d29b"/><stop offset="0.5" stop-color="#e7bc7f"/><stop offset="1" stop-color="#c89255"/></linearGradient>
</defs>
<ellipse cx="382" cy="500" rx="225" ry="20" fill="#000" opacity=".16"/>
<path d="M105 168 355 54l293 130-251 125z" fill="url(#top)" stroke="#d89a57" stroke-width="3"/>
<path d="M105 168v252l292 111V309z" fill="url(#front)" stroke="#86431d" stroke-width="3"/>
<path d="M397 309v222l251-123V184z" fill="url(#side)" stroke="#612b11" stroke-width="3"/>
<path d="M254 100 549 230l-53 26-297-128z" fill="url(#tape)" opacity=".96"/>
<path d="M254 100v67" stroke="#a8703a" stroke-width="4" opacity=".5"/>
<path d="M496 256v78" stroke="#825024" stroke-width="4" opacity=".45"/>
<path d="M116 180 388 284" stroke="#f0b978" stroke-width="2" opacity=".28"/>
<path d="M409 316 635 206" stroke="#d8904c" stroke-width="2" opacity=".28"/>

<!-- Shipping label follows the front-face perspective -->
<g transform="translate(145 220) skewY(25.8)">
  <rect width="180" height="106" rx="7" fill="#fbfcff" stroke="#d7dde8" stroke-width="3"/>
  <text x="14" y="20" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#162238">SHIPPING LABEL</text>
  <text x="14" y="35" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#657084">TRACKED PARCEL</text>
  <line x1="14" y1="43" x2="166" y2="43" stroke="#d4d9e2" stroke-width="2"/>
  <text x="14" y="58" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#6b7485">REFERENCE</text>
  <text x="14" y="72" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#1a2537">TTG-TXN</text>
  <g fill="#111">
    <rect x="15" y="80" width="3" height="17"/><rect x="21" y="80" width="2" height="17"/><rect x="26" y="80" width="5" height="17"/><rect x="35" y="80" width="2" height="17"/><rect x="41" y="80" width="4" height="17"/><rect x="49" y="80" width="2" height="17"/><rect x="55" y="80" width="6" height="17"/><rect x="65" y="80" width="3" height="17"/><rect x="72" y="80" width="2" height="17"/><rect x="78" y="80" width="5" height="17"/><rect x="87" y="80" width="3" height="17"/><rect x="94" y="80" width="6" height="17"/><rect x="104" y="80" width="2" height="17"/><rect x="110" y="80" width="5" height="17"/><rect x="119" y="80" width="2" height="17"/><rect x="125" y="80" width="4" height="17"/><rect x="133" y="80" width="6" height="17"/><rect x="143" y="80" width="3" height="17"/><rect x="150" y="80" width="2" height="17"/><rect x="156" y="80" width="6" height="17"/>
  </g>
</g>

<!-- Handling sticker follows the right-face perspective -->
<g transform="translate(470 329) skewY(-25)">
  <rect width="118" height="64" rx="7" fill="#fff7df" stroke="#e0b66e" stroke-width="3"/>
  <path d="M20 15h20v24H20zM24 11h12v6H24z" fill="none" stroke="#9d4d21" stroke-width="3"/>
  <path d="M29 42v8M22 50h14" stroke="#9d4d21" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="25" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#9d4d21">HANDLE</text>
  <text x="50" y="41" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#9d4d21">WITH CARE</text>
</g>
</svg>